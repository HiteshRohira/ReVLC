[package]
name = "revlc"
version = "0.2.6"
description = "A modern media player built on libVLC"
authors = ["revlc contributors"]
license = "GPL-3.0-or-later"
edition = "2024"
publish = false

[lib]
name = "revlc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
# Loads libVLC from ordinary paths rather than \\?\ ones; see vlc.rs.
dunce = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tauri-plugin-updater = "2"
# Analytics; the same HTTP and TLS crates the updater uses.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
# The version Tauri uses, for WebView2 settings it doesn't expose.
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Media_DirectShow", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
