<!doctype html>
<!-- Static UI mockups for ReVLC. Open with ?v=a|b|c&s=play|home -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ReVLC mockups</title>
<style>
  :root { --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; background: #000; font-family: var(--font); color: #f5f5f7; -webkit-font-smoothing: antialiased; }
  .win { position: relative; width: 1280px; height: 800px; overflow: hidden; background: #000; }
  .lights { position: absolute; top: 16px; left: 18px; display: flex; gap: 8px; z-index: 50; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
  .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
  .ic { display: inline-block; width: var(--s, 20px); height: var(--s, 20px); background: currentColor; flex-shrink: 0;
        -webkit-mask: var(--i) center / contain no-repeat; mask: var(--i) center / contain no-repeat; }
  .frame { position: absolute; inset: 0; background: center / cover no-repeat; }
  .frame.scope { inset: auto 0; top: 50%; height: 533px; transform: translateY(-50%); }
  .sub { position: absolute; left: 0; right: 0; text-align: center; font-size: 30px; font-weight: 500;
         text-shadow: 0 0 6px rgb(0 0 0 / .9), 0 2px 2px rgb(0 0 0 / .8); letter-spacing: .01em; }
  button { all: unset; display: inline-grid; place-items: center; cursor: default; }
  .muted { color: rgb(235 235 245 / .6); }
  .tnum { font-variant-numeric: tabular-nums; }

  /* ---------- A: Floating (IINA-like) ---------- */
  .a .scrim-top { position: absolute; inset: 0 0 auto; height: 70px; background: linear-gradient(rgb(0 0 0 / .55), transparent); }
  .a .ttl { position: absolute; top: 14px; width: 100%; text-align: center; font-size: 13px; font-weight: 500; color: rgb(255 255 255 / .85); }
  .a .bar { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); width: 620px; padding: 12px 18px 14px;
            border-radius: 16px; background: rgb(22 22 24 / .9); box-shadow: 0 10px 40px rgb(0 0 0 / .45); border: 1px solid rgb(255 255 255 / .06); }
  .a .row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .a .grp { display: flex; align-items: center; gap: 14px; }
  .a .grp.r { justify-content: flex-end; gap: 16px; }
  .a .play { --s: 30px; }
  .a .mini { width: 70px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, #fff 70%, rgb(255 255 255 / .22) 70%); }
  .a .seek { display: flex; align-items: center; gap: 12px; margin-top: 12px; font-size: 11.5px; }
  .a .track { position: relative; flex: 1; height: 4px; border-radius: 2px; background: rgb(255 255 255 / .2); }
  .a .track b { position: absolute; inset: 0 auto 0 0; width: 34%; border-radius: 2px; background: #fff; }
  .a .track s { position: absolute; inset: 0 auto 0 0; width: 52%; border-radius: 2px; background: rgb(255 255 255 / .28); }
  .a .pop { position: absolute; right: 74px; bottom: 76px; width: 260px; padding: 6px; border-radius: 12px;
            background: rgb(30 30 32 / .97); border: 1px solid rgb(255 255 255 / .08); box-shadow: 0 16px 50px rgb(0 0 0 / .5); font-size: 13px; }
  .a .pop h6 { margin: 8px 10px 4px; font-size: 11px; font-weight: 600; color: rgb(235 235 245 / .5); }
  .a .pop .it { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 7px; }
  .a .pop .it.on { background: #0a84ff; }
  .a .pop .it .ic { --s: 14px; }
  .a .pop .it span { flex: 1; }
  .a .pop hr { border: 0; border-top: 1px solid rgb(255 255 255 / .08); margin: 6px 4px; }
  .a .slider { display: flex; align-items: center; gap: 10px; padding: 6px 10px 10px; font-size: 12px; }
  .a .slider .t { position: relative; flex: 1; height: 4px; border-radius: 2px; background: rgb(255 255 255 / .2); }
  .a .slider .t::after { content: ""; position: absolute; left: calc(50% - 7px); top: -5px; width: 14px; height: 14px; border-radius: 50%; background: #fff; }
  .a .seg { display: flex; margin: 0 10px 8px; padding: 2px; border-radius: 8px; background: rgb(255 255 255 / .08); font-size: 12px; }
  .a .seg span { flex: 1; text-align: center; padding: 4px 0; border-radius: 6px; }
  .a .seg span.on { background: rgb(255 255 255 / .18); }

  .a.home { background: #161618; }
  .a.home .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 110px; }
  .a.home .mark { font-size: 15px; font-weight: 600; letter-spacing: .02em; color: rgb(235 235 245 / .6); }
  .a.home .drop { margin-top: 18px; width: 560px; height: 230px; border-radius: 18px; border: 1.5px dashed rgb(255 255 255 / .16);
                  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgb(255 255 255 / .02); }
  .a.home .drop .big { --s: 40px; color: rgb(235 235 245 / .35); }
  .a.home .drop p { margin: 0; font-size: 17px; font-weight: 500; }
  .a.home .btns { display: flex; gap: 10px; margin-top: 8px; }
  .a.home .btn { padding: 7px 14px; border-radius: 8px; background: rgb(255 255 255 / .1); font-size: 13px; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
  .a.home .btn.pri { background: #fff; color: #000; }
  .a.home .recent { width: 560px; margin-top: 34px; }
  .a.home .recent h5 { margin: 0 0 8px 4px; font-size: 12px; font-weight: 600; color: rgb(235 235 245 / .5); }
  .a.home .r { display: flex; align-items: center; gap: 14px; padding: 8px; border-radius: 10px; }
  .a.home .r:first-of-type { background: rgb(255 255 255 / .05); }
  .a.home .th { position: relative; width: 96px; height: 54px; border-radius: 6px; background: center / cover; overflow: hidden; }
  .a.home .th i { position: absolute; left: 0; bottom: 0; height: 3px; background: #fff; }
  .a.home .r .n { flex: 1; font-size: 13.5px; font-weight: 500; }
  .a.home .r .n div { margin-top: 3px; font-size: 12px; font-weight: 400; }

  /* ---------- B: Cinema (Apple TV / Infuse) ---------- */
  .b .scrim { position: absolute; inset: auto 0 0; height: 300px; background: linear-gradient(transparent, rgb(0 0 0 / .55) 45%, rgb(0 0 0 / .85)); }
  .b .scrim-top { position: absolute; inset: 0 0 auto; height: 160px; background: linear-gradient(rgb(0 0 0 / .7), transparent); }
  .b .head { position: absolute; left: 44px; top: 52px; }
  .b .head h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -.01em; }
  .b .head .meta { margin-top: 6px; display: flex; gap: 8px; align-items: center; font-size: 13px; }
  .b .badge { padding: 1px 5px; border: 1px solid rgb(255 255 255 / .45); border-radius: 4px; font-size: 10.5px; font-weight: 600; color: rgb(255 255 255 / .8); }
  .b .ctl { position: absolute; left: 44px; right: 44px; bottom: 30px; }
  .b .track { position: relative; height: 6px; border-radius: 3px; background: rgb(255 255 255 / .22); }
  .b .track b { position: absolute; inset: 0 auto 0 0; width: 34%; border-radius: 3px; background: #fff; }
  .b .times { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12.5px; }
  .b .row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .b .grp { display: flex; align-items: center; gap: 26px; }
  .b .grp.r { gap: 22px; }
  .b .play { --s: 34px; }
  .b .pill { padding: 3px 9px; border-radius: 6px; background: rgb(255 255 255 / .14); font-size: 12px; font-weight: 600; }
  .b .on { color: #000; background: #fff; border-radius: 8px; padding: 5px; }
  .b .panel { position: absolute; right: 44px; bottom: 112px; display: grid; grid-template-columns: 200px 200px 240px; gap: 0;
              border-radius: 16px; background: rgb(28 28 30 / .96); border: 1px solid rgb(255 255 255 / .08); box-shadow: 0 20px 60px rgb(0 0 0 / .6); overflow: hidden; }
  .b .col { padding: 16px 8px 12px; border-right: 1px solid rgb(255 255 255 / .07); }
  .b .col:last-child { border: 0; padding: 16px 18px; }
  .b .col h6 { margin: 0 10px 8px; font-size: 13px; font-weight: 700; }
  .b .opt { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; font-size: 13.5px; }
  .b .opt .ic { --s: 14px; }
  .b .opt .ck { width: 14px; }
  .b .opt.sel { background: rgb(255 255 255 / .1); }
  .b .opt small { display: block; font-size: 11.5px; color: rgb(235 235 245 / .55); }
  .b .sync { margin-bottom: 18px; font-size: 13px; }
  .b .sync .lab { display: flex; justify-content: space-between; margin-bottom: 10px; }
  .b .sync .t { position: relative; height: 4px; border-radius: 2px; background: rgb(255 255 255 / .2); }
  .b .sync .t::before { content: ""; position: absolute; left: 50%; top: -4px; width: 1px; height: 12px; background: rgb(255 255 255 / .35); }
  .b .sync .t::after { content: ""; position: absolute; left: var(--x, 50%); top: -6px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgb(0 0 0 / .5); }
  .b .sync .ends { display: flex; justify-content: space-between; margin-top: 8px; font-size: 11px; }

  .b.home { background: #0f0f10; }
  .b.home .nav { position: absolute; top: 0; left: 0; right: 0; height: 52px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .b.home .tab { padding: 6px 14px; border-radius: 16px; font-size: 13px; font-weight: 600; color: rgb(235 235 245 / .6); }
  .b.home .tab.on { background: rgb(255 255 255 / .14); color: #fff; }
  .b.home .tools { position: absolute; right: 22px; top: 13px; display: flex; gap: 18px; color: rgb(235 235 245 / .8); }
  .b.home .hero { position: absolute; top: 52px; left: 0; right: 0; height: 360px; background: center 35% / cover; }
  .b.home .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgb(15 15 16 / .95), rgb(15 15 16 / .2) 60%), linear-gradient(transparent 55%, #0f0f10); }
  .b.home .hero .txt { position: absolute; left: 44px; bottom: 40px; z-index: 1; width: 440px; }
  .b.home .hero .kick { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: rgb(235 235 245 / .6); text-transform: uppercase; }
  .b.home .hero h1 { margin: 6px 0 6px; font-size: 40px; font-weight: 800; letter-spacing: -.02em; }
  .b.home .hero p { margin: 0 0 18px; font-size: 14px; line-height: 1.45; color: rgb(235 235 245 / .75); }
  .b.home .cta { display: flex; gap: 10px; align-items: center; }
  .b.home .cta .go { padding: 10px 20px; border-radius: 10px; background: #fff; color: #000; font-size: 14px; font-weight: 700; display: inline-flex; gap: 8px; align-items: center; }
  .b.home .cta .go .ic { --s: 16px; }
  .b.home .cta .prog { width: 120px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, #fff 34%, rgb(255 255 255 / .25) 34%); }
  .b.home .shelf { position: absolute; left: 44px; right: 0; }
  .b.home .shelf h5 { margin: 0 0 10px; font-size: 17px; font-weight: 700; }
  .b.home .cards { display: flex; gap: 14px; }
  .b.home .card { width: 228px; }
  .b.home .card .th { position: relative; height: 128px; border-radius: 10px; background: center / cover; overflow: hidden; }
  .b.home .card .th i { position: absolute; left: 10px; right: 10px; bottom: 8px; height: 4px; border-radius: 2px; background: rgb(255 255 255 / .3); }
  .b.home .card .th i b { display: block; height: 100%; border-radius: 2px; background: #fff; }
  .b.home .card .n { margin-top: 8px; font-size: 13px; font-weight: 600; }
  .b.home .card .m { margin-top: 2px; font-size: 12px; }
  .b.home .dev { width: 228px; height: 70px; border-radius: 12px; background: rgb(255 255 255 / .06); display: flex; align-items: center; gap: 12px; padding: 0 16px; font-size: 13px; font-weight: 600; }
  .b.home .dev small { display: block; font-size: 11.5px; font-weight: 400; color: rgb(235 235 245 / .55); }

  /* ---------- C: Pro (YouTube-like density, VLC orange) ---------- */
  .c { --acc: #ff7a1a; }
  .c .scrim { position: absolute; inset: auto 0 0; height: 150px; background: linear-gradient(transparent, rgb(0 0 0 / .75)); }
  .c .scrim-top { position: absolute; inset: 0 0 auto; height: 70px; background: linear-gradient(rgb(0 0 0 / .6), transparent); }
  .c .ttl { position: absolute; top: 13px; left: 92px; font-size: 13.5px; font-weight: 600; }
  .c .ttl span { font-weight: 400; color: rgb(235 235 245 / .6); }
  .c .seekwrap { position: absolute; left: 16px; right: 16px; bottom: 56px; }
  .c .chapters { display: flex; gap: 3px; height: 5px; }
  .c .chapters i { position: relative; height: 100%; background: rgb(255 255 255 / .25); border-radius: 1px; overflow: hidden; }
  .c .chapters i b { position: absolute; inset: 0 auto 0 0; background: var(--acc); }
  .c .chapters i s { position: absolute; inset: 0 auto 0 0; background: rgb(255 255 255 / .35); }
  .c .knob { position: absolute; top: -5px; width: 15px; height: 15px; margin-left: -7px; border-radius: 50%; background: var(--acc); }
  .c .preview { position: absolute; bottom: 20px; width: 200px; margin-left: -100px; text-align: center; }
  .c .preview .im { height: 112px; border-radius: 8px; border: 2px solid #fff; background: center / cover; }
  .c .preview .tx { margin-top: 6px; font-size: 12.5px; font-weight: 600; text-shadow: 0 1px 3px #000; }
  .c .row { position: absolute; left: 16px; right: 16px; bottom: 10px; height: 40px; display: flex; align-items: center; justify-content: space-between; }
  .c .grp { display: flex; align-items: center; gap: 20px; font-size: 13px; }
  .c .vol { width: 64px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, #fff 70%, rgb(255 255 255 / .3) 70%); margin-left: -10px; }
  .c .play { --s: 26px; }
  .c .cc { position: relative; }
  .c .cc::after { content: ""; position: absolute; left: 2px; right: 2px; bottom: -6px; height: 2px; border-radius: 1px; background: var(--acc); }
  .c .menu { position: absolute; right: 16px; bottom: 62px; width: 300px; padding: 8px 0; border-radius: 12px; background: rgb(24 24 26 / .95); box-shadow: 0 12px 40px rgb(0 0 0 / .5); font-size: 13.5px; }
  .c .menu .it { display: flex; align-items: center; gap: 12px; padding: 9px 16px; }
  .c .menu .it.hl { background: rgb(255 255 255 / .08); }
  .c .menu .it span { flex: 1; }
  .c .menu .it em { font-style: normal; color: rgb(235 235 245 / .6); }
  .c .menu .it .ic { --s: 18px; }
  .c .menu .it .chev { --s: 15px; color: rgb(235 235 245 / .5); }
  .c .menu hr { border: 0; border-top: 1px solid rgb(255 255 255 / .08); margin: 6px 0; }
  .c .tog { width: 30px; height: 18px; border-radius: 9px; background: rgb(255 255 255 / .25); position: relative; }
  .c .tog::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; }

  .c.home { background: #121214; display: grid; grid-template-columns: 220px 1fr; }
  .c.home aside { background: #18181b; padding: 54px 12px 12px; border-right: 1px solid rgb(255 255 255 / .05); }
  .c.home aside h6 { margin: 18px 10px 6px; font-size: 11px; font-weight: 600; color: rgb(235 235 245 / .45); }
  .c.home aside .nv { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; font-size: 13.5px; color: rgb(235 235 245 / .85); }
  .c.home aside .nv .ic { --s: 17px; color: rgb(235 235 245 / .6); }
  .c.home aside .nv.on { background: rgb(255 122 26 / .16); color: #fff; }
  .c.home aside .nv.on .ic { color: var(--acc); }
  .c.home main { padding: 18px 28px; overflow: hidden; }
  .c.home .top { display: flex; align-items: center; gap: 12px; }
  .c.home .search { flex: 1; max-width: 420px; height: 34px; border-radius: 9px; background: rgb(255 255 255 / .07); display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 13px; color: rgb(235 235 245 / .45); }
  .c.home .sp { flex: 1; }
  .c.home .b2 { height: 34px; padding: 0 14px; border-radius: 9px; background: rgb(255 255 255 / .08); display: inline-flex; gap: 7px; align-items: center; font-size: 13px; font-weight: 600; }
  .c.home .b2.pri { background: var(--acc); color: #fff; }
  .c.home .b2 .ic { --s: 16px; }
  .c.home h2 { margin: 26px 0 12px; font-size: 20px; font-weight: 700; }
  .c.home .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 16px; }
  .c.home .tile .th { position: relative; aspect-ratio: 16/9; border-radius: 8px; background: center / cover; overflow: hidden; }
  .c.home .tile .th .dur { position: absolute; right: 6px; bottom: 8px; padding: 1px 5px; border-radius: 4px; background: rgb(0 0 0 / .75); font-size: 11px; font-weight: 600; }
  .c.home .tile .th .pg { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgb(255 255 255 / .25); }
  .c.home .tile .th .pg b { display: block; height: 100%; background: var(--acc); }
  .c.home .tile .n { margin-top: 8px; font-size: 13px; font-weight: 600; }
  .c.home .tile .m { margin-top: 2px; font-size: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const P = new URLSearchParams(location.search);
  const v = P.get("v") || "a", s = P.get("s") || "play";
  const I = (n, size, extra = "") =>
    `<i class="ic ${extra}" style="--i:url(${n.includes("/") ? n : `node_modules/lucide-static/icons/${n}.svg`});${size ? `--s:${size}px` : ""}"></i>`;
  // Filled glyphs read better than outlines for the primary transport controls.
  const PLAY = "assets/play-fill.svg";
  const PAUSE = "assets/pause-fill.svg";
  const lights = `<div class="lights"><i></i><i></i><i></i></div>`;
  const A = (f) => `assets/${f}`;
  const LIB = [
    ["Tears of Steel", "tears1.jpg", "12:14", 34, "8 min left"],
    ["Spring", "spring1.jpg", "7:44", 0, "2019"],
    ["Cosmos Laundromat", "cosmos.jpg", "12:10", 72, "3 min left"],
    ["Big Buck Bunny", "bunny140.jpg", "9:56", 0, "2008"],
    ["Elephants Dream", "elephants.jpg", "10:53", 0, "2006"],
    ["Sintel", "sintel.jpg", "14:48", 15, "12 min left"],
    ["Tears of Steel — Bridge", "tears3.jpg", "2:10", 0, "Clip"],
    ["Spring — Descent", "spring2.jpg", "1:32", 0, "Clip"],
  ];

  const views = {
    a: {
      play: () => `
        <div class="win a">
          <div class="frame" style="background-image:url(${A("bunny140.jpg")})"></div>
          <div class="scrim-top"></div>${lights}
          <div class="ttl">Big Buck Bunny.mkv</div>
          <div class="sub" style="bottom:150px">Somebody's been eating my apples.</div>
          <div class="pop">
            <h6>SUBTITLES</h6>
            <div class="it"><span style="padding-left:22px">Off</span></div>
            <div class="it on">${I("check")}<span>English</span><span class="muted" style="flex:0;color:#fff;opacity:.8">SRT</span></div>
            <div class="it"><span style="padding-left:22px">English (SDH)</span></div>
            <div class="it"><span style="padding-left:22px">Español</span></div>
            <div class="it"><span style="padding-left:22px">Load from file…</span></div>
            <hr />
            <h6>TIMING</h6>
            <div class="slider"><span class="muted">−5s</span><div class="t"></div><span class="muted">+5s</span></div>
            <h6>SIZE</h6>
            <div class="seg"><span>S</span><span class="on">M</span><span>L</span><span>XL</span></div>
          </div>
          <div class="bar">
            <div class="row">
              <div class="grp">${I("volume-2", 18)}<div class="mini"></div></div>
              <div class="grp" style="gap:24px">${I("rotate-ccw", 20)}${I(PAUSE, 28, "play")}${I("rotate-cw", 20)}</div>
              <div class="grp r">${I("captions", 19)}${I("audio-lines", 19)}${I("list-video", 19)}${I("picture-in-picture-2", 19)}${I("maximize", 17)}</div>
            </div>
            <div class="seek"><span class="tnum">3:21</span><div class="track"><s></s><b></b></div><span class="tnum muted">−6:35</span></div>
          </div>
        </div>`,
      home: () => `
        <div class="win a home">${lights}
          <div class="center">
            <div class="mark">ReVLC</div>
            <div class="drop">
              ${I("square-play", 40, "big")}
              <p>Drop a video here</p>
              <div class="muted" style="font-size:13px">or open a file, folder, disc or network stream</div>
              <div class="btns"><span class="btn pri">${I("folder-open", 15)} Open…</span><span class="btn">${I("link", 15)} Open URL</span></div>
            </div>
            <div class="recent"><h5>RECENT</h5>
              ${LIB.filter((x) => x[3] || x[0] === "Big Buck Bunny").slice(0, 4).map((x) => `
                <div class="r"><div class="th" style="background-image:url(${A(x[1])})">${x[3] ? `<i style="width:${x[3]}%"></i>` : ""}</div>
                <div class="n">${x[0]}<div class="muted">${x[3] ? `${x[4]} · ` : ""}${x[2]}</div></div>
                ${x[3] ? I("play", 16) : ""}</div>`).join("")}
            </div>
          </div>
        </div>`,
    },
    b: {
      play: () => `
        <div class="win b">
          <div class="frame scope" style="background-image:url(${A("tears1.jpg")})"></div>
          <div class="scrim-top"></div><div class="scrim"></div>${lights}
          <div class="head"><h1>Tears of Steel</h1>
            <div class="meta muted">2012 · Sci-Fi · 12 min <span class="badge">4K</span><span class="badge">HDR10</span><span class="badge">5.1</span></div></div>
          <div class="panel">
            <div class="col"><h6>Audio</h6>

      home: () => `
        <div class="win b home">${lights}

          <div class="hero" style="background-image:url(${A("cosmos.jpg")})">
            <div class="txt"><div class="kick">Continue watching</div><h1>Cosmos Laundromat</h1>
              <p>On a desolate island, a suicidal sheep named Franck meets his fate in a quirky salesman, who offers him the gift of a lifetime.</p>
              <div class="cta"><span class="go">${I(PLAY, 16)} Resume</span><span class="muted" style="font-size:13px">3 min left</span></div></div>
          </div>
          <div class="shelf" style="top:432px"><h5>Up Next</h5><div class="cards">
            ${LIB.filter((x) => x[0] !== "Cosmos Laundromat").slice(0, 5).map((x) => `
              <div class="card"><div class="th" style="background-image:url(${A(x[1])})">${x[3] ? `<i><b style="width:${x[3]}%"></b></i>` : ""}</div>

          <div class="shelf" style="top:652px"><h5>Network</h5><div class="cards">
            <div class="dev">${I("hard-drive", 22)}<div>Living Room NAS<small>SMB · 412 videos</small></div></div>
            <div class="dev">${I("server", 22)}<div>Plex Media Server<small>UPnP / DLNA</small></div></div>
            <div class="dev">${I("cast", 22)}<div>Kitchen TV<small>Chromecast</small></div></div>
            <div class="dev">${I("radio", 22)}<div>Internet Radio<small>Icecast directory</small></div></div>
          </div></div>
        </div>`,
    },
    c: {
      play: () => `
        <div class="win c">
          <div class="frame" style="background-image:url(${A("elephants.jpg")})"></div>
          <div class="scrim-top"></div><div class="scrim"></div>${lights}
          <div class="ttl">Elephants Dream <span>· Chapter 3 — The Machine</span></div>
          <div class="sub" style="bottom:250px">It's all going according to plan.</div>
          <div class="menu">
            <div class="it">${I("gauge")}<span>Playback speed</span><em>Normal</em>${I("chevron-right", 0, "chev")}</div>
            <div class="it">${I("audio-lines")}<span>Audio</span><em>English 5.1</em>${I("chevron-right", 0, "chev")}</div>
            <div class="it">${I("captions")}<span>Subtitles</span><em>English</em>${I("chevron-right", 0, "chev")}</div>
            <div class="it hl">${I("crop")}<span>Crop &amp; aspect</span><em>Auto</em>${I("chevron-right", 0, "chev")}</div>
            <div class="it">${I("sliders-horizontal")}<span>Video adjustments</span>${I("chevron-right", 0, "chev")}</div>
            <div class="it">${I("audio-waveform")}<span>Audio effects</span><em>Equaliser off</em>${I("chevron-right", 0, "chev")}</div>
            <hr />
            <div class="it">${I("repeat")}<span>A–B loop</span><div class="tog"></div></div>
            <div class="it">${I("clock")}<span>Sleep timer</span><em>Off</em>${I("chevron-right", 0, "chev")}</div>
            <div class="it">${I("info")}<span>Media information</span>${I("chevron-right", 0, "chev")}</div>
          </div>
          <div class="seekwrap">
            <div class="preview" style="left:52%"><div class="im" style="background-image:url(${A("elephants.jpg")});background-size:340%;background-position:62% 30%"></div><div class="tx">5:41 · The Machine</div></div>
            <div class="chapters">

              <i style="flex:22"><s style="width:90%"></s><b style="width:52%"></b></i><i style="flex:26"></i><i style="flex:20"></i>
            </div>
            <div class="knob" style="left:44%"></div>
          </div>
          <div class="row">
            <div class="grp">${I(PAUSE, 24, "play")}${I("skip-forward", 20)}${I("volume-2", 20)}<div class="vol"></div>
              <span class="tnum">4:47 <span class="muted">/ 10:53</span></span></div>
            <div class="grp"><span class="cc">${I("captions", 22)}</span>${I("settings", 21)}${I("list-video", 21)}${I("picture-in-picture-2", 21)}${I("maximize", 19)}</div>
          </div>
        </div>`,
      home: () => `
        <div class="win c home">${lights}

            <div class="nv on">${I("house")}Home</div>

            <div class="nv">${I("list-music")}Playlists</div>

            <div class="nv">${I("hard-drive")}Living Room NAS</div>
            <div class="nv">${I("server")}DLNA servers</div>
            <div class="nv">${I("radio")}Internet radio</div>
            <div class="nv">${I("disc-3")}Discs</div>

            <div class="nv">${I("link")}Recent URLs</div>
          </aside>
          <main>
            <div class="top"><div class="search">${I("search", 15)} Search your library</div><div class="sp"></div>
              <span class="b2">${I("link")}Open URL</span><span class="b2 pri">${I("folder-open")}Open…</span></div>
            <h2>Continue watching</h2>
            <div class="grid">${LIB.filter((x) => x[3]).concat([LIB[1]]).slice(0, 4).map(tile).join("")}</div>

            <div class="grid">${[LIB[3], LIB[4], LIB[6], LIB[7]].map(tile).join("")}</div>

            <div class="grid">${[["Tears of Steel — Rooftop", "tears9.jpg", "3:05", 0, "1080p · MKV"], ["Sintel", "sintel.jpg", "14:48", 0, "4K · HEVC"], LIB[2], LIB[1]].map(tile).join("")}</div>
          </main>
        </div>`,
    },
  };
  function tile(x) {
    return `<div class="tile"><div class="th" style="background-image:url(${A(x[1])})"><span class="dur">${x[2]}</span>${x[3] ? `<div class="pg"><b style="width:${x[3]}%"></b></div>` : ""}</div>
      <div class="n">${x[0]}</div><div class="m muted">${x[3] ? x[4] : x[4]}</div></div>`;
  }
  document.getElementById("root").innerHTML = views[v][s]();
</script>
