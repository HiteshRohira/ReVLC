# Type-checks the UI and lints and tests the Rust side on all three platforms,
# for every push to main and every pull request. The release workflow
# runs it first and builds nothing if it fails.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libx11-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Check the UI
        run: npm run check

      # The Rust build embeds the built UI and bundles src-tauri/vlc and
      # src-tauri/ffmpeg, which can stay empty: nothing here loads them.
      - name: Build the UI
        run: npm run build && mkdir -p src-tauri/vlc src-tauri/ffmpeg

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test
