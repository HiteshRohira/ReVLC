# Type-checks the UI and lints and tests the Rust side on all supported
# platforms for code PRs. Docs/site-only PRs still report a required green
# gate without running the full matrix. The release workflow calls this for
# the full checks before it builds anything.
name: Checks

on:
  pull_request:
  workflow_call:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      run_app_checks: ${{ steps.scope.outputs.run_app_checks }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # A reusable call from Release always runs the complete matrix.
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run_app_checks=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          mapfile -t changed < <(git diff --name-only "origin/$BASE_REF...HEAD")
          run_app_checks=false
          for path in "${changed[@]}"; do
            case "$path" in
              README.md|docs/*|site/*|.github/ISSUE_TEMPLATE/*) ;;
              *) run_app_checks=true; break ;;
            esac
          done
          echo "run_app_checks=$run_app_checks" >> "$GITHUB_OUTPUT"

  checks:
    needs: scope
    if: needs.scope.outputs.run_app_checks == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libx11-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Check the UI
        run: npm run check

      # The Rust build embeds the built UI and bundles src-tauri/vlc and, on
      # macOS and Windows, the FFmpeg sidecar. Empty stand-ins do: nothing
      # here runs them.
      - name: Build the UI
        run: |
          npm run build && mkdir -p src-tauri/vlc src-tauri/binaries
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          case "$RUNNER_OS" in
            Windows) touch "src-tauri/binaries/ffmpeg-$triple.exe" ;;
            macOS) touch "src-tauri/binaries/ffmpeg-$triple" ;;
          esac

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test

  required:
    name: required
    if: always()
    needs: [scope, checks]
    runs-on: ubuntu-latest
    steps:
      - name: Require the full matrix when app checks are in scope
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUN_APP_CHECKS: ${{ needs.scope.outputs.run_app_checks }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          [[ "$SCOPE_RESULT" == "success" ]]
          if [[ "$RUN_APP_CHECKS" == "true" ]]; then
            [[ "$CHECKS_RESULT" == "success" ]]
          else
            [[ "$RUN_APP_CHECKS" == "false" && "$CHECKS_RESULT" == "skipped" ]]
          fi
