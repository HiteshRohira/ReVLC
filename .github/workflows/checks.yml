# Type-checks the UI and tests, and lints and tests the Rust side on all
# supported platforms for code changes. Docs/site-only PRs still report a
# required green gate without running the full matrix. Also runs on main
# and in the merge queue. The release workflow calls this, with UI checks
# and engine tests, before it builds anything.
name: Checks

on:
  pull_request:
    # edited covers a retarget to another base, which changes the diff.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  merge_group:
  workflow_call:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_app_checks: ${{ steps.scope.outputs.run_app_checks }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: scope
        uses: ./.github/actions/scope

  # The download page's platform detection (site/*.test.js). Cheap, so it
  # runs for every change, site-only ones included.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:site

  checks:
    needs: scope
    if: needs.scope.outputs.run_app_checks == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libx11-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - run: npm ci

      - name: Check the UI
        run: npm run check

      - name: Type-check the tests
        if: runner.os == 'Linux'
        run: npx tsc -p tsconfig.tests.json

      # The Rust build embeds the built UI and bundles src-tauri/vlc and, on
      # macOS and Windows, the FFmpeg sidecar. Empty stand-ins do: nothing
      # here runs them.
      - name: Build the UI
        run: |
          npm run build && mkdir -p src-tauri/vlc src-tauri/binaries
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          case "$RUNNER_OS" in
            Windows) touch "src-tauri/binaries/ffmpeg-$triple.exe" ;;
            macOS) touch "src-tauri/binaries/ffmpeg-$triple" ;;
          esac

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo nextest run --locked --profile ci

  # Which Rust lines the tests run, as a report on the run's summary page.
  # Report only: it never fails a PR.
  coverage:
    needs: scope
    if: needs.scope.outputs.run_app_checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libx11-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: npm ci && npm run build && mkdir -p src-tauri/vlc
      - name: Measure
        working-directory: src-tauri
        run: |
          cargo llvm-cov nextest --locked --profile ci --lcov --output-path lcov.info
          {
            echo '## Rust test coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: src-tauri/lcov.info

  required:
    # The branch protection on main requires this check by name.
    name: Checks passed
    if: always()
    needs: [scope, site, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the full matrix when app checks are in scope
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUN_APP_CHECKS: ${{ needs.scope.outputs.run_app_checks }}
          SITE_RESULT: ${{ needs.site.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          [[ "$SCOPE_RESULT" == "success" && "$SITE_RESULT" == "success" ]]
          if [[ "$RUN_APP_CHECKS" == "true" ]]; then
            [[ "$CHECKS_RESULT" == "success" ]]
          else
            [[ "$RUN_APP_CHECKS" == "false" && "$CHECKS_RESULT" == "skipped" ]]
          fi
