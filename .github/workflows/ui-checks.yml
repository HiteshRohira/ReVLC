# Two jobs on every app PR. browser: the UI in Chromium and WebKit with the
# backend mocked (tests/ui). linux: the built Linux package driven through
# Cua (scripts/qa/ci/cua_suite.py), the same suite that runs on the Mac, the PC and the VMs
# before a release (scripts/qa/device/). macOS and Windows run there rather
# than here: hosted Macs have no GPU, and WebView2 hides the page from Cua
# unless a screen reader seems to be running, which the device runs handle
# without changing the app.
#
# The job writes its results to the run summary and uploads screenshots,
# the accessibility tree of every failed check, logs and a screen recording.
#
# Analytics stay off: CI builds have no PostHog key, and the suite seeds
# settings with analytics disabled (scripts/qa/appdata.py) before every
# launch. Never set REVLC_ANALYTICS_SEND here.
name: UI checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: ['README.md', 'docs/**', 'site/**', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # Pinned so a Cua release can't change the results under us.
  CUA_DRIVER_RS_VERSION: '0.37.0'
  CUA_TELEMETRY: '0'
  DO_NOT_TRACK: '1'

jobs:
  # The UI in Chromium and WebKit with the backend mocked (tests/ui):
  # every layout, dialog, shortcut and state the Rust side can put it in.
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-tests-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # The hosted runner's Azure mirror can stall; see linux-build.yml.
          [[ -f /etc/apt/apt-mirrors.txt ]] && echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          sudo -E apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=2 update
          sudo -E apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=2 install -y \
            libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libx11-dev patchelf \
            libvlc5 libvlccore9 vlc-plugin-base vlc-plugin-video-output \
            xvfb dbus-x11 at-spi2-core openbox xcompmgr ffmpeg python3-pil
      - run: npm ci
      - name: Build and install the .deb
        run: |
          bash scripts/build-linux.sh
          sudo apt-get install -y ./src-tauri/target/release/bundle/deb/*.deb
      - name: Install Cua Driver
        run: |
          /bin/bash -c "$(curl -fsSL https://cua.ai/driver/install.sh)" -- --no-modify-path
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cua-driver" --version
      - name: Drive ReVLC with Cua
        env:
          # The suite runs this if Cua's daemon dies mid-run.
          CUA_DAEMON_RESTART: cua-driver serve --permission-mode unrestricted --dangerously-bypass-approvals --no-overlay >/dev/null 2>&1 &
        run: |
          mkdir -p "$RUNNER_TEMP/run/logs"
          # Xvfb has no DRI3 device: keep WebKit off its DMA-BUF path.
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          xvfb-run -a -s '-screen 0 1920x1080x24' dbus-run-session -- bash -c '
            set -euo pipefail
            run="$RUNNER_TEMP/run"
            openbox >"$run/logs/openbox.log" 2>&1 &
            xcompmgr >"$run/logs/compositor.log" 2>&1 &
            cua-driver serve --permission-mode unrestricted --dangerously-bypass-approvals --no-overlay >"$run/logs/cua-serve.log" 2>&1 &
            for _ in {1..30}; do cua-driver status && break; sleep 1; done
            # The recording is evidence only; the run does not depend on it.
            ffmpeg -hide_banner -loglevel error -y -f x11grab -framerate 15 -video_size 1920x1080 -i "$DISPLAY" \
              -vf "scale=1280:-2" -c:v libx264 -pix_fmt yuv420p "$run/recording.mp4" >"$run/recording.log" 2>&1 &
            rec=$!
            status=0
            python3 -I scripts/qa/ci/cua_suite.py --out "$run" --ffmpeg ffmpeg -- revlc || status=$?
            kill -INT "$rec" 2>/dev/null || true
            wait "$rec" || true
            exit "$status"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-checks-linux
          path: |
            ${{ runner.temp }}/run/report.json
            ${{ runner.temp }}/run/report.md
            ${{ runner.temp }}/run/recording.mp4
            ${{ runner.temp }}/run/recording.log
            ${{ runner.temp }}/run/screenshots/
            ${{ runner.temp }}/run/logs/
          if-no-files-found: warn
