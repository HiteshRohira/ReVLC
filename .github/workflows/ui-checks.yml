# Drives the built app on GitHub's macOS, Windows and Linux runners through
# Cua (scripts/qa/ci/cua_suite.py): playback, keyboard, fullscreen, menus and
# dialogs, resume after relaunch, opening files from the OS, bad files, engine
# failure, damaged history, the command line, long Unicode paths, folders, the
# queue, a minimum-size window and subtitles. Each job writes its results to
# the run summary and uploads screenshots, logs and a screen recording. Not a
# required check yet: run it for a while first.
#
# Hosted Macs have no GPU, so libVLC can't create its OpenGL view there; the
# macOS job skips the picture checks.
#
# Analytics stay off: CI builds have no PostHog key, and the suite seeds
# settings with analytics disabled (scripts/qa/appdata.py) before every
# launch. Never set REVLC_ANALYTICS_SEND here.
name: UI checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: ['README.md', 'docs/**', 'site/**', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # Pinned so a Cua release can't change the results under us.
  CUA_DRIVER_RS_VERSION: '0.37.0'
  CUA_TELEMETRY: '0'
  DO_NOT_TRACK: '1'

jobs:
  macos:
    # macos-26, as Cua's own CI uses: on macos-14 Cua's daemon segfaults in
    # macOS's SkyLight event code before accessibility clicks.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Download libVLC and FFmpeg
        run: bash scripts/prepare-libvlc.sh && bash scripts/prepare-ffmpeg.sh
      - name: Build ReVLC.app
        run: npx tauri build --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Set up Cua Driver
        run: bash scripts/qa/ci/cua-macos-setup.sh "$RUNNER_TEMP/run/cua-setup" src-tauri/binaries/ffmpeg-*
      - name: Drive ReVLC with Cua
        env:
          # The suite runs this if Cua's daemon dies mid-run (it has on hosted Macs).
          CUA_DAEMON_RESTART: open -n -g /Applications/CuaDriver.app --args serve --permission-mode unrestricted --dangerously-bypass-approvals --no-overlay
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          mkdir -p "$RUNNER_TEMP/run"
          ff="$(ls src-tauri/binaries/ffmpeg-*)"
          app=src-tauri/target/release/bundle/macos/ReVLC.app
          # The recording is evidence only; the run doesn't depend on it.
          "$ff" -hide_banner -loglevel error -y -f avfoundation -framerate 15 -capture_cursor 1 -i 'Capture screen 0:none' \
            -t 1500 -vf 'scale=1280:-2' -c:v libx264 -pix_fmt yuv420p "$RUNNER_TEMP/run/recording.mp4" \
            >"$RUNNER_TEMP/run/recording.log" 2>&1 &
          rec=$!
          status=0
          python3 scripts/qa/ci/cua_suite.py --no-video --out "$RUNNER_TEMP/run" --ffmpeg "$ff" --bundle "$app" -- \
            "$app/Contents/MacOS/revlc" || status=$?
          kill -INT "$rec" 2>/dev/null || true  # stop recording; FFmpeg finishes the file
          wait "$rec" || true
          exit "$status"
      - name: Collect Cua crash reports
        if: always()
        run: cp ~/Library/Logs/DiagnosticReports/*[Cc]ua* "$RUNNER_TEMP/run/logs/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-checks-macos
          path: |
            ${{ runner.temp }}/run/report.json
            ${{ runner.temp }}/run/report.md
            ${{ runner.temp }}/run/recording.mp4
            ${{ runner.temp }}/run/recording.log
            ${{ runner.temp }}/run/screenshots/
            ${{ runner.temp }}/run/logs/
            ${{ runner.temp }}/run/cua-setup/
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Download libVLC and FFmpeg
        run: bash scripts/prepare-libvlc.sh && bash scripts/prepare-ffmpeg.sh
      # No installer: the unbundled exe loads libVLC through REVLC_VLC_DIR.
      # WebView2 only exposes the page to UI Automation for a detected screen
      # reader, and ignores WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS because
      # Tauri passes its own arguments. Add the flag to Tauri's defaults.
      - name: Build revlc.exe
        run: |
          node -e '
            const w = require("./src-tauri/tauri.windows.conf.json").app.windows[0];
            w.additionalBrowserArgs = "--disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection --force-renderer-accessibility";
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/ci.conf.json",
              JSON.stringify({ app: { windows: [w] }, bundle: { createUpdaterArtifacts: false } }));'
          npx tauri build --no-bundle --config "$RUNNER_TEMP/ci.conf.json"
      # D:/a/_temp style, which Git Bash and the native tools both accept.
      - name: Make the run folder
        run: |
          run="$(cygpath -m "$RUNNER_TEMP")/run"
          echo "RUN=$run" >> "$GITHUB_ENV"
          mkdir -p "$run"
      - name: Set up Cua Driver
        shell: pwsh
        run: |
          irm https://cua.ai/driver/install.ps1 | iex
          $bin = "$env:LOCALAPPDATA\Programs\Cua\cua-driver\bin"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$bin\cua-driver.exe" --version
          Start-Process -FilePath "$bin\cua-driver.exe" -ArgumentList 'serve','--permission-mode','unrestricted','--dangerously-bypass-approvals','--no-overlay' -WindowStyle Hidden
          for ($i = 0; $i -lt 30; $i++) {
            & "$bin\cua-driver.exe" status
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 1
          }
          exit 1
      - name: Drive ReVLC with Cua
        env:
          REVLC_VLC_DIR: ${{ github.workspace }}\src-tauri\vlc
          # The suite runs this (through cmd.exe) if Cua's daemon dies mid-run.
          CUA_DAEMON_RESTART: start "" /B "%LOCALAPPDATA%\Programs\Cua\cua-driver\bin\cua-driver.exe" serve --permission-mode unrestricted --dangerously-bypass-approvals --no-overlay
        run: |
          python -m pip install --quiet pillow
          ff="$(ls src-tauri/binaries/ffmpeg-*.exe)"
          # The recording is evidence only; the run doesn't depend on it.
          "$ff" -hide_banner -loglevel error -y -f gdigrab -framerate 15 -i desktop \
            -t 1500 -vf 'scale=1280:-2' -c:v libx264 -tune zerolatency -pix_fmt yuv420p -g 15 \
            -movflags +frag_keyframe+empty_moov "$RUN/recording.mp4" >"$RUN/recording.log" 2>&1 &
          rec=$!
          status=0
          python scripts/qa/ci/cua_suite.py --out "$RUN" --ffmpeg "$ff" -- src-tauri/target/release/revlc.exe || status=$?
          # Git Bash can't send FFmpeg a gentle stop. The MP4 above is written
          # in one-second fragments (a keyframe a second) with no encoder
          # lookahead, so it stays playable, and complete, when FFmpeg is killed.
          kill "$rec" 2>/dev/null || true
          wait "$rec" || true
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-checks-windows
          path: |
            ${{ runner.temp }}/run/report.json
            ${{ runner.temp }}/run/report.md
            ${{ runner.temp }}/run/recording.mp4
            ${{ runner.temp }}/run/recording.log
            ${{ runner.temp }}/run/screenshots/
            ${{ runner.temp }}/run/logs/
          if-no-files-found: warn

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # The hosted runner's Azure mirror can stall; see linux-build.yml.
          [[ -f /etc/apt/apt-mirrors.txt ]] && echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          sudo -E apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=2 update
          sudo -E apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=2 install -y \
            libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libx11-dev patchelf \
            libvlc5 libvlccore9 vlc-plugin-base vlc-plugin-video-output \
            xvfb dbus-x11 at-spi2-core openbox xcompmgr ffmpeg python3-pil
      - run: npm ci
      - name: Build and install the .deb
        run: |
          bash scripts/build-linux.sh
          sudo apt-get install -y ./src-tauri/target/release/bundle/deb/*.deb
      - name: Install Cua Driver
        run: |
          /bin/bash -c "$(curl -fsSL https://cua.ai/driver/install.sh)" -- --no-modify-path
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cua-driver" --version
      - name: Drive ReVLC with Cua
        env:
          # The suite runs this if Cua's daemon dies mid-run.
          CUA_DAEMON_RESTART: cua-driver serve --permission-mode unrestricted --dangerously-bypass-approvals --no-overlay >/dev/null 2>&1 &
        run: |
          mkdir -p "$RUNNER_TEMP/run/logs"
          # Xvfb has no DRI3 device: keep WebKit off its DMA-BUF path.
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          xvfb-run -a -s '-screen 0 1920x1080x24' dbus-run-session -- bash -c '
            set -euo pipefail
            run="$RUNNER_TEMP/run"
            openbox >"$run/logs/openbox.log" 2>&1 &
            xcompmgr >"$run/logs/compositor.log" 2>&1 &
            cua-driver serve --permission-mode unrestricted --dangerously-bypass-approvals --no-overlay >"$run/logs/cua-serve.log" 2>&1 &
            for _ in {1..30}; do cua-driver status && break; sleep 1; done
            # The recording is evidence only; the run does not depend on it.
            ffmpeg -hide_banner -loglevel error -y -f x11grab -framerate 15 -video_size 1920x1080 -i "$DISPLAY" \
              -vf "scale=1280:-2" -c:v libx264 -pix_fmt yuv420p "$run/recording.mp4" >"$run/recording.log" 2>&1 &
            rec=$!
            status=0
            python3 -I scripts/qa/ci/cua_suite.py --out "$run" --ffmpeg ffmpeg -- revlc || status=$?
            kill -INT "$rec" 2>/dev/null || true
            wait "$rec" || true
            exit "$status"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-checks-linux
          path: |
            ${{ runner.temp }}/run/report.json
            ${{ runner.temp }}/run/report.md
            ${{ runner.temp }}/run/recording.mp4
            ${{ runner.temp }}/run/recording.log
            ${{ runner.temp }}/run/screenshots/
            ${{ runner.temp }}/run/logs/
          if-no-files-found: warn
